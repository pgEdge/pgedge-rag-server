name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version: "1.26"

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
              with:
                  version: v2.11.4

    test:
        name: Test
        runs-on: ubuntu-latest

        # The identity tests need a real PostgreSQL with pgvector. They
        # skip when RAG_TEST_DATABASE_URL is unset, and a skip is not a
        # pass: they are the only tests that can observe an identity
        # leaking between callers, or surviving on a pooled connection.
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ragtest
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version: "1.26"

            - name: Run tests
              run: make test
              env:
                  RAG_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ragtest?sslmode=disable

            - name: Upload coverage
              uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
              with:
                  files: coverage.out
                  fail_ci_if_error: false

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version: "1.26"

            - name: Build binary
              run: make build

            - name: Upload binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: pgedge-rag-server
                  path: bin/pgedge-rag-server

    docs:
        name: Build Documentation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"

            - name: Install MkDocs
              run: pip install mkdocs mkdocs-material mkdocs-redoc-tag

            - name: Build documentation
              run: mkdocs build --strict
