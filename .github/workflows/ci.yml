name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: "1.27.3"

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.15.0

    test:
        name: Test (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest

        # Test the build toolchain and the minimum Go version that go.mod
        # declares, so a change that needs a newer Go fails here.
        strategy:
            fail-fast: false
            matrix:
                go-version: ["1.26.10", "1.27.3"]

        # The identity tests need a real PostgreSQL with pgvector. They
        # skip when RAG_TEST_DATABASE_URL is unset, and a skip is not a
        # pass: they are the only tests that can observe an identity
        # leaking between callers, or surviving on a pooled connection.
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ragtest
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Run tests
              run: make test
              env:
                  RAG_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ragtest?sslmode=disable

            - name: Upload coverage
              if: matrix.go-version == '1.27.3'
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: coverage.out
                  fail_ci_if_error: false

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: "1.27.3"

            - name: Build binary
              run: make build

            - name: Upload binary
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pgedge-rag-server
                  path: bin/pgedge-rag-server

    docs:
        name: Build Documentation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.15"

            - name: Install MkDocs
              run: pip install mkdocs mkdocs-material mkdocs-redoc-tag

            - name: Build documentation
              run: mkdocs build --strict
