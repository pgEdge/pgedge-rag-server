---
# Codacy analysis configuration.
#
# See https://docs.codacy.com/repositories-configure/codacy-configuration-file/
# for the schema. Note that Codacy always reads this file from the default
# branch, so a change here only takes full effect once it has been merged.

engines:
  opengrep:
    exclude_paths:
      # Opengrep's Go SQL injection rule
      # (Semgrep_go_sql_rule-concat-sqli) is a taint rule whose sources
      # are fmt.Sprintf and string concatenation, and whose sinks are
      # Exec/Query/QueryRow. It defines no sanitisers, so there is no way
      # for correctly escaped code to satisfy it: any dynamically
      # assembled statement reaching the driver is reported.
      #
      # That matters for the database test fixtures, which have to
      # assemble DDL dynamically because PostgreSQL does not accept a
      # bound parameter in place of an identifier; you cannot write
      # CREATE ROLE $1 or DROP SCHEMA $1. The fixtures therefore build
      # role and schema names with fmt.Sprintf, escaping every identifier
      # through pgx.Identifier{...}.Sanitize() and every literal through
      # quoteLiteral. The values interpolated are generated by uniqueName
      # from t.Name() and the process ID, so no external or
      # caller-supplied input reaches them at all.
      #
      # Excluding test files from this one engine keeps Opengrep scanning
      # the whole of the production code, where the rule is worth having,
      # whilst not demanding an impossible fix from fixture DDL; test
      # code is not deployed and is not part of the server's attack
      # surface.
      #
      # Production code must continue to use bound parameters. The one
      # deliberate exception is the query_database tool, which exists to
      # execute caller-supplied SQL and is documented as such.
      - "**/*_test.go"
      - "*_test.go"
